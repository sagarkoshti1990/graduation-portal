<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8B2842" />
    <meta name="description" content="Generating Better Livelihoods Program" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GBL Program" />
    <title>Generating Better Livelihoods Program</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/pwa/favicon-32.png" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      * {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      }
    </style>
    <script>
      window.STORAGE_KEYS = {
        LANGUAGE: '@app_language',
        COLOR_MODE: 'colorMode',
      };

      // Set lang and dir attributes before React loads to prevent flash
      (function () {
        try {
          // RTL languages list (must match the one in src/config/i18n.ts)
          const RTL_LANGUAGES = ['ar', 'he', 'fa', 'ur'];

          // Get saved language from localStorage
          // Fallback to direct key if STORAGE_KEYS is not loaded
          const languageKey = window.STORAGE_KEYS?.LANGUAGE;
          const savedLanguage = localStorage.getItem(languageKey);
          const language = savedLanguage || 'en';

          // Determine if language is RTL
          const isRTL = RTL_LANGUAGES.includes(language);

          // Set HTML attributes
          document.documentElement.setAttribute('lang', language);
          document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
        } catch (error) {
          // console.error('Error setting initial language/direction:', error);
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <main id="root"></main>
    <script>
      if ('serviceWorker' in navigator) {
        var isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (isDev) {
          // Development: unregister any previously installed SW so stale cache never breaks HMR
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.unregister(); });
          });
        } else {
          // Production only: register SW for offline app-shell caching
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/service-worker.js').catch(function (err) {
              console.warn('Service worker registration failed:', err);
            });
          });
        }
      }
    </script>
  </body>
</html>
