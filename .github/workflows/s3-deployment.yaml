name: Tag Build & Deploy Frontend to S3 (BRAC)

on:
  push:
    tags:
      - "v*"

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET: ${{ secrets.S3_BUCKET_BRAC }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_BRAC }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_BRAC }}
  TAG: ${{ github.ref_name }}

permissions:
  contents: read
  id-token: write   # required for OIDC — do not add other perms unless needed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production   # optional: gate this with required reviewers if you have GH environments set up
    concurrency:
      group: s3-deploy-brac
      cancel-in-progress: false   # never cancel a mid-flight S3 sync/invalidation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"       # pin to your actual runtime; don't leave floating
          cache: "npm"

      - name: Create .env for build
        run: |
          echo "${{ secrets.QA_ENV_BRAC }}" > .env

      - name: Install dependencies
        run: npm install --legacy-peer-deps   # ci, not install — deterministic, respects lockfile

      - name: Build
        run: npm run build

      # =========================
      # AWS Authentication (OIDC — no static keys)
      # =========================
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-brac-deploy-${{ github.run_id }}

      # =========================
      # Sync build output to S3
      # =========================
      - name: Sync to S3
        run: |
          aws s3 sync ./dist s3://${{ env.S3_BUCKET }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"

          # index.html must never be long-cached, or you'll serve stale app shells
          aws s3 cp ./build/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      # =========================
      # Invalidate CloudFront
      # =========================
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
